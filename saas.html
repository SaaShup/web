<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="SaaS cloud portal">
    <meta name="author" content="LaV">
    <title>SaaShup</title>
    <link rel="icon" href="/img/logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/css/bootstrap.min.css"
        integrity="sha512-GQGU0fMMi238uA+a/bdWJfpUGKUkBdgfFdgBm72SUQ6BeyWjoY/ton0tEjH+OSH9iP4Dfh+7HM0I9f5eR0L/4w=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
        integrity="sha512-iBBXm8fW90+nuLcSKlbmrPcLa0OT92xO1BIsZ+ywDWZCvqsWgccV3gFoRBv0z+8dLJgyAHIhR35VZc2oM/gI1w=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"
        integrity="sha512-894YE6QWD5I59HgZOGReFYm4dnWc1Qt5NtvYSaNcOP+u1T9qYdvdihz0PPSiiqn/+/3e7Jo4EaG7TubfWGUrMQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/js/bootstrap.bundle.min.js"
        integrity="sha512-pax4MlgXjHEPfCwcJLQhigY7+N8rt6bVvWLFyUMuxShv170X53TRzGPmPkZmGBhk+jikR8WBM4yl7A9WMHHqvg=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdn.auth0.com/js/auth0-spa-js/1.14/auth0-spa-js.production.js"></script>
    <script src="https://js.stripe.com/v3"></script>
    <script src="/js/auth.js?v=1648747708"></script>
    <script src="/js/google.js?v=1647416781"></script>
    <script src="/js/lang.js?v=1648747708"></script>
    <script src="/js/saas.js?v=1648747708"></script>
    <script src="https://embed.tawk.to/61bf5e9180b2296cfdd26ed6/1fn9oiql4" crossorigin="anonymous"></script>
    <link href="/css/main.css?v=1643306229" rel="stylesheet">
</head>

<body class="d-flex flex-column">

    <nav class="navbar navbar-expand-md fixed-top bg-white">
        <div class="container-fluid">
            <a class="navbar-brand" style="padding: 0 0 0 0;" href="https://www.saashup.com"><img
                    src="/img/logo_saashup.png" height="48px" /></a>
            <button class="navbar-toggler custom-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarCollapse" aria-controls="navbarCollapse" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarCollapse">
                <ul class="navbar-nav me-auto mb-2 mb-md-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#" id="nav-home-btn"><i
                                class="fas fa-home"></i>
                            <span id="navHome"></span></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" aria-current="page" href="#" id="nav-admin-btn"><i
                                class="fas fa-money-check-alt"></i>
                            <span id="navBilling"></span></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" aria-current="page" href="https://doc.saashup.com" target="_blank"><i
                                class="fas fa-file-alt"></i> <span id="navDoc"></span></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" aria-current="page" href="https://status.saashup.com" target="_blank"><i
                                class="fas fa-battery-full"></i> <span id="navStatus"></span></a>
                    </li>
                </ul>
                <span class="pe-3 pt-2">
                    <div class="dropdown">
                        <a class="btn dropdown-toggle" href="#" role="button" id="dropdownMenuLink"
                            data-bs-toggle="dropdown" aria-expanded="false">
                            <img id="lang-flag" src="/img/en.png" width="32px" />
                        </a>
                        <ul class="dropdown-menu" style="padding-left:2rem;" aria-labelledby="dropdownMenuLink">
                            <li class="p-2"><img id="lang-flag" src="/img/en.png" width="32px"
                                    onclick="updateLang('en');$('#lang-flag').attr('src', '/img/en.png');" /></li>
                            <li class="p-2"><img id="lang-flag" src="/img/fr.png" width="32px"
                                    onclick="updateLang('fr');$('#lang-flag').attr('src', '/img/fr.png');""/></li>
                    <li class=" p-2"><img id="lang-flag" src="/img/de.png" width="32px"
                                    onclick="updateLang('de');$('#lang-flag').attr('src', '/img/de.png');""/></li>
                    </ul>
                </div>
                </span>
                <div class=" d-flex mx-3">
                                <img id="avatar" class="rounded-circle d-none" width="36px" height="36px" src=""
                                    onclick="appLogout();" />
                    </div>
            </div>
        </div>
    </nav>

    <div class="modal fade" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false" id="modalNotification">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="modalNotificationTitle"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p id="modalNotificationContent"></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-primary" data-bs-dismiss="modal"
                        id="modalNotificationOk">Ok</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false" id="modalQuestion">
        <div class="modal-dialog" id="modalQuestionDialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="modalQuestionTitle"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p id="modalQuestionContent"></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal"
                        onclick="setTimeout(function (){$('#modalQuestionDialog').removeClass('modal-xl')}, 1000)"
                        ;>No</button>
                    <button type="button" class="btn btn-danger" id="modalQuestionYes">Yes</button>
                </div>
            </div>
        </div>
    </div>

    <main class="h-100 mt-5">

        <div class="container">
            <div class="row">
                <div id="saas" class="d-none">
                    <div class="col-12">
                        <div class="card my-4">
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-sm-12 col-md-3 text-center">
                                        <img src="/img/logo_saashup.png" width="100%" />
                                    </div>
                                    <div class="col-sm-12 col-md-9">
                                        <h1 class="card-title text-primary text-center">SaaShup Saas</h1>
                                        <div class="row text-center">
                                            <select class="form-select form-select-lg mb-3" id="plan-type-select">
                                                <option>Iron</option>
                                            </select>
                                        </div>
                                        <div class="text-muted text-center m-3">no credit card required</div>
                                        <div class="form-group row text-center p-2">
                                            <label class="col-sm-4 col-form-label">DockerHub Image : </label>
                                            <div class="col-sm-8">
                                                <input class="form-control" placeholder="nginx" id="image"></input>
                                            </div>
                                        </div>
                                        <div class="form-group row text-center p-2">
                                            <label class="col-sm-4 col-form-label">Exposed port : </label>
                                            <div class="col-sm-8">
                                                <input class="form-control" type="number" placeholder="80"
                                                    id="port"></input>
                                            </div>
                                        </div>
                                        <div class="form-group row text-center p-2">
                                            <label class="col-sm-4 col-form-label">Memory Size : </label>
                                            <div class="col-sm-8">
                                                <select class="form-control" id="memory" disabled>
                                                    <option>200</option>
                                                    <option>300</option>
                                                    <option>400</option>
                                                    <option>500</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="form-group row text-center p-2">
                                            <label class="col-sm-4 col-form-label">Price : </label>
                                            <div class="col-sm-8">
                                                <input class="form-control" type="number" id="price" value="10"></input>
                                            </div>
                                        </div>
                                        <div class="form-group row text-center p-2">
                                            <label class="col-sm-4 col-form-label">Admin Password : </label>
                                            <div class="col-sm-8">
                                                <input class="form-control" type="password" id="password"></input>
                                            </div>
                                        </div>
                                        <div class="m-4 text-center">
                                            <button class="btn btn-primary" id="create-saas">Create Saas</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="engine" class="d-none">
                    <div class="col-12">
                        <div class="card my-4">
                            <div class="card-body">
                                <h1 class="card-title text-primary text-center">SaaShup Engine</h1>
                                <div class="m-4 text-center">
                                    <button class="btn btn-primary" id="create-engine">Create Engine</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="admin" class="d-none">
                    <div class="col-12">
                        <div class="card my-4">
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-sm-12 col-md-3 text-center">
                                        <img src="img/saashup2.png" width="100%" />
                                    </div>
                                    <div class="col-sm-12 col-md-9">
                                        <h1 class="card-title text-primary text-center">SaaShup</h1>
                                        <div id="register-div" class="d-none">
                                            <a href="#" class="btn btn-outline-primary" id="register"
                                                onclick="stripeGO();"></a>
                                        </div>
                                        <div id="add-card" class="d-none">
                                            <a href="#" class="btn btn-outline-primary" id="add-card-btn"
                                                onclick="stripeGO();"></a>
                                        </div>
                                        <div id="profile-card"></div>
                                        <div class="my-3 text-end">
                                            <button class="btn btn-danger" onclick="appLogout();">Logout</button>
                                        </div>
                                        <div class="my-3 text-end">
                                            <button class="btn btn-outline-danger" id="delete" onclick="logout();"
                                                disabled>
                                                <i class="fas fa-ban"></i> <span
                                                    id="delete-myaccount-text"></span></button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="image-card" class="d-none">
                    <div class="col-12">
                        <div class="card my-4">
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-sm-12 col-md-3 text-center">
                                        <img src="img/saashup2.png" width="100%" />
                                    </div>
                                    <div class="col-sm-12 col-md-9">
                                        <h1 class="card-title text-primary text-center">SaaShup</h1>
                                        <h2>Image: <span id="my-image"></span></h2>
                                        <h4>Status: <span id="my-status" class="badge"></span></h4>
                                        <h4>Saas: <a href="" id="image_saas_href" target="_blank"><span
                                                    id="image_saas"></span></a></h4>
                                        <h4>Admin: <a href="" id="image_admin_href" target="_blank"><span
                                                    id="image_admin"></span></a></h4>
                                        <h5>Type: <span id="image_type" class="text-info"></span></h5>
                                        <h5>Memory: <span id="image_memory"></span>Mb</h5>
                                        <h5>created on: <span id="created_at"></span></h5>
                                        <div class="m-4 text-center">
                                            <button class="btn btn-danger" id="delete-saas">Delete Saas</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <footer class="footer mt-auto py-2" style="background-color:#e1eefc;width:100%;">
        <div class="p-1 text-center" style="width:100%;">
            <img src="/img/logo_saashup.png" class="rounded-circle" width="24" /> saashup © 2021
        </div>
    </footer>

</body>

</html>
