name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install
    - name: Install Hugo CLI
      run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v0.128.0/hugo_extended_0.128.0_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
    - name: Start Hugo
      run: hugo
    - name: Run website in background
      run: |
        nohup python3 -m http.server 8080 --directory public > /tmp/saashup-web.log 2>&1 &
        for i in {1..30}; do
          if curl -fsS http://127.0.0.1:8080/ > /dev/null; then
            exit 0
          fi
          sleep 1
        done
        cat /tmp/saashup-web.log
        exit 1
    - name: Run Playwright Test
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
