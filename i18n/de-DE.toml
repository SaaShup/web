[help_app_support_text]

other = "<p>Wir können Unterstützung für Ihre Anwendung bieten.</p><p>Unser Support-Team kann auf Anfragen zu Anwendungsproblemen, Anfragen usw. antworten.</p><p>Wir stellen Verfahren, Wissensdatenbanken, FAQs oder Dokumente bereit, und wir bieten Level-1-Support, erstellen Tickets zur Nachverfolgung und eskalieren an Ihre Teams.</p>"

