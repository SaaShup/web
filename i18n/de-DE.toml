[first]

other = "<b class='text-primary'>Haben Sie eine SaaS?</b> <br>Machen Sie SaaS zu unserem Problem.<br>Konzentrieren Sie sich auf Produkt und Umsatz, während wir Ihnen eine SaaS-Plattformlösung bieten.<br>"

[intro]

other = "<span class='text-primary'>Saas-ify</span> jetzt<br>Ihre Anwendung!<br><br>Sie können eine <a href='https://nginx.saashup.com' target='_blank'>Demo</a><br>anfordern und Ihren Verkauf<br>über Ihre individuelle <span class='text-primary'>SaaS</span> ohne versteckte Kosten steigern."

[description]

other = "<span class='text-info'>SaaShup</span> ist eine einfache Lösung, um Ihre Anwendung in eine <span class='text-primary'>SaaS</span> umzuwandeln.<br>Wir helfen Ihnen, Ihre Anwendung freizulegen und die Verwaltung zu vereinfachen. Entwickeln Sie Ihre Software und lassen Sie uns die Bereitstellung an Ihre Kunden über Ihre eigene angepasste SaaS übernehmen. Unsere Dienstleistungen bleiben flexibel und skalierbar, wir passen die Kapazität an Ihre Aktivität an."

[explain]

other = "<div class='text-info text-center'>Was bekomme ich?</div><br>Sie müssen nur einen Docker bereitstellen, und wir bieten eine komplette SaaS-Lösung mit unserer Frontanwendung, Authentifizierung, Zahlung, Überwachung, Benachrichtigungen, Backups, Protokollierung, Prüfung, L1-Support usw.<br><br>Sie haben auch Ihre eigene Administrationsseite, um Ihre SaaS zu konfigurieren und anzupassen.<br><br><a href='/contact/'>Kontaktieren Sie uns</a>, wenn Sie Fragen haben."

