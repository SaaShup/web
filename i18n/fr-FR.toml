[first]

other = "<b class='text-primary'>Avez-vous un SaaS ?</b> <br>Laissez-nous nous en occuper.<br>Travaillez sur votre produit et votre revenu pendant que nous gerons votre Saas.<br>"

[intro]

other = "Saas-ifiez<br> votre <span class='text-primary'>application</span>!<br><br>Demandez une <a href='https://nginx.saashup.com' target='_blank'>démonstration</a><br> puis commencez à <span class='text-primary'>vendre</span><br> avec une interface <span class='text-primary'>Saas</span> personnalisée à un coût défini et maîtrisé"

[description]

other = "<span class='text-info'>SaaShup</span> propose une solution simple pour mettre en <span class='text-primary'>SaaS</span> (Software as a Service).  Nous vous simplifions la gestion des services nécessaires et vous aidons à répendre votre produit sur le net.<br>Concentrez-vous sur votre application et laissez-nous la charge de la déployer.<br>Besoin de customisation? Nos services sont adaptables et évolutifs contactez-nous pour nous précisez vos besoins."

[explain]

other = "<div class='text-info text-center'>Qu'est-ce que j'achète?</div><br>Précisez le docker à utiliser et nous vous proposons une solution SaaS complète frontend, authentification, paiement, sauvegardes, monitoring, alerts, logs, audits, support L1...<br><br>Vous aurez aussi accès à la page d'administration de votre Saas pour le configurer. <br><br>Besoin de précisions? <a href='/contact/'>contactez-nous</a>"

